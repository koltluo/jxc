<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1f4e79" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="进销存" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="鑫盛五金建材贸易行 · 进销存管理系统（离线可用）" />
  <title>鑫盛五金建材贸易行 · 进销存管理系统</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="icon" href="./icon-192.png" />

  <style>
    /* ============================================================
   theme.css —— 手机网页版样式（移动优先 · 响应式）
   配色沿用 Excel 版：主色 1F4E79 / 财务 7030A0 / 涨红跌绿
   ============================================================ */

:root {
  /* 主色系 */
  --primary: #1f4e79;
  --primary-dark: #163a5a;
  --primary-light: #e8f0f8;
  --primary-soft: #f4f8fc;

  /* 财务色系 */
  --fin: #7030a0;
  --fin-light: #f2ecf8;

  /* 语义色（中国股市惯例：涨红跌绿） */
  --up: #c00000;
  --up-bg: #fdeaea;
  --down: #1e7b3c;
  --down-bg: #e8f5ec;
  --warn: #b26a00;
  --warn-bg: #fff4e0;
  --info: #1f4e79;

  /* 中性色 */
  --bg: #f2f4f7;
  --card: #ffffff;
  --border: #e2e6ec;
  --border-strong: #c9d1da;
  --text: #1a2029;
  --text-2: #5a6675;
  --text-3: #8b97a6;
  --input-bg: #fff9e6;
  --calc-bg: #eaf3ea;

  /* 尺寸 */
  --radius: 10px;
  --radius-sm: 6px;
  --h-topbar: 52px;
  --h-tabbar: 56px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  --shadow-1: 0 1px 2px rgba(16, 32, 56, .06), 0 1px 3px rgba(16, 32, 56, .05);
  --shadow-2: 0 4px 12px rgba(16, 32, 56, .10);
  --shadow-3: 0 12px 32px rgba(16, 32, 56, .18);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  overscroll-behavior-y: none;
}

body { padding-bottom: calc(var(--h-tabbar) + var(--safe-b)); }

/* ---------------- 顶部栏 ---------------- */
.topbar {
  position: sticky; top: 0; z-index: 60;
  display: flex; align-items: center; gap: 8px;
  height: calc(var(--h-topbar) + var(--safe-t));
  padding: var(--safe-t) 12px 0;
  background: var(--primary);
  color: #fff;
  box-shadow: var(--shadow-2);
}
.topbar .tb-title { flex: 1; font-size: 17px; font-weight: 600; letter-spacing: .3px; }
.topbar .tb-sub { display: block; font-size: 11px; font-weight: 400; opacity: .78; letter-spacing: 0; margin-top: 1px; }
.topbar button {
  border: 0; background: rgba(255, 255, 255, .14); color: #fff;
  width: 36px; height: 36px; border-radius: 9px; font-size: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; flex: none;
}
.topbar button:active { background: rgba(255, 255, 255, .28); }
.topbar .tb-text { width: auto; padding: 0 12px; font-size: 14px; font-weight: 600; }

/* ---------------- 底部标签栏 ---------------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--h-tabbar) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(255, 255, 255, .96);
  backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--border);
}
.tabbar a {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 10px; color: var(--text-3); text-decoration: none;
  transition: color .15s;
}
.tabbar a .ti { font-size: 21px; line-height: 1; }
.tabbar a.on { color: var(--primary); font-weight: 600; }

/* ---------------- 页面容器 ---------------- */
.page { padding: 12px; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ---------------- 卡片 ---------------- */
.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow-1); margin-bottom: 12px; overflow: hidden;
}
.card-hd {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  font-size: 14px; font-weight: 600; color: var(--primary);
}
.card-hd .sp { flex: 1; }
.card-hd .badge {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
  background: var(--primary-light); color: var(--primary);
}
.card-bd { padding: 12px 14px; }
.card-bd.flush { padding: 0; }

/* ---------------- KPI 数字块 ---------------- */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.kpi {
  background: var(--card); border-radius: var(--radius); padding: 12px 14px;
  box-shadow: var(--shadow-1); position: relative; overflow: hidden;
}
.kpi::after {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary);
}
.kpi.fin::after { background: var(--fin); }
.kpi.up::after { background: var(--up); }
.kpi.down::after { background: var(--down); }
.kpi .k-l { font-size: 12px; color: var(--text-2); margin-bottom: 5px; }
.kpi .k-v {
  font-size: 20px; font-weight: 700; letter-spacing: -.4px;
  font-variant-numeric: tabular-nums; color: var(--text);
}
.kpi .k-v.sm { font-size: 16px; }
.kpi .k-x { font-size: 11px; color: var(--text-3); margin-top: 3px; }

/* ---------------- 九宫格入口 ---------------- */
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(6, 1fr); } }
.grid a, .grid button {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px; padding: 12px 4px; border: 0; border-radius: var(--radius);
  background: var(--card); box-shadow: var(--shadow-1);
  font-size: 11px; color: var(--text-2); text-decoration: none; cursor: pointer;
  transition: transform .12s;
}
.grid a:active, .grid button:active { transform: scale(.95); }
.grid .gi {
  font-size: 22px; width: 40px; height: 40px; border-radius: 11px;
  display: grid; place-items: center; background: var(--primary-light);
  color: var(--primary);
}
.grid .gi.fin { background: var(--fin-light); color: var(--fin); }
.grid .gi.warn { background: var(--warn-bg); color: var(--warn); }

/* ---------------- 列表 ---------------- */
.list { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-1); overflow: hidden; }
.li {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s;
}
.li:last-child { border-bottom: 0; }
.li:active { background: var(--primary-soft); }
.li .l-main { flex: 1; min-width: 0; }
.li .l-t1 {
  font-size: 14px; font-weight: 600; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.li .l-t2 {
  font-size: 12px; color: var(--text-3); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap;
}
.li .l-t2 em { font-style: normal; }
.li .l-right { text-align: right; flex: none; }
.li .l-amt { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.li .l-tag { font-size: 10px; margin-top: 3px; }

/* ---------------- 标签 ---------------- */
.tag {
  display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 7px;
  border-radius: 20px; line-height: 16px; white-space: nowrap;
}
.tag.ok { background: var(--down-bg); color: var(--down); }
.tag.danger { background: var(--up-bg); color: var(--up); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.info { background: var(--primary-light); color: var(--primary); }
.tag.fin { background: var(--fin-light); color: var(--fin); }
.tag.mute { background: #eef1f5; color: var(--text-3); }

.up-t { color: var(--up); }
.down-t { color: var(--down); }
.mute-t { color: var(--text-3); }

/* ---------------- 表格（横向滚动） ---------------- */
.tw { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.sheet { border-collapse: collapse; width: 100%; font-size: 12.5px; white-space: nowrap; }
table.sheet th {
  position: sticky; top: 0; z-index: 2;
  background: var(--primary); color: #fff; font-weight: 600;
  padding: 8px 10px; text-align: left; font-size: 12px;
}
table.sheet td { padding: 7px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
table.sheet tbody tr:nth-child(even) { background: #fafbfd; }
table.sheet tbody tr:active { background: var(--primary-soft); }
table.sheet td.num, table.sheet th.num { text-align: right; }
table.sheet td.ctr, table.sheet th.ctr { text-align: center; }
table.sheet tr.total { background: var(--primary-light) !important; font-weight: 700; }
table.sheet tr.total td { border-top: 2px solid var(--primary); color: var(--primary); }
table.sheet tr.sub td { background: #f6f9fc; font-weight: 600; }
table.sheet tr.hdr-row td { background: #eef3f8; font-weight: 600; color: var(--primary); }
table.sheet td.sticky-l { position: sticky; left: 0; background: inherit; z-index: 1; }

/* ---------------- 表单 ---------------- */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 5px; font-weight: 500; }
.field label .req { color: var(--up); margin-left: 2px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 11px; font-size: 15px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--input-bg); color: var(--text); font-family: inherit;
  transition: border-color .15s, box-shadow .15s;
  -webkit-appearance: none; appearance: none;
}
.field select {
  background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235a6675'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");
  background-repeat: no-repeat; background-position: right 8px center;
  background-size: 20px; padding-right: 32px;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 0; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(31, 78, 121, .12);
}
.field input[readonly], .field input:disabled, .field select:disabled {
  background: var(--calc-bg); color: var(--text-2);
}
.field .hint { font-size: 11px; color: var(--text-3); margin-top: 4px; }
.field .err { font-size: 11px; color: var(--up); margin-top: 4px; }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.frow-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 400px) { .frow-3 { grid-template-columns: 1fr 1fr; } }

/* ---------------- 按钮 ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 16px; font-size: 15px; font-weight: 600; font-family: inherit;
  border: 0; border-radius: var(--radius-sm); cursor: pointer;
  background: var(--primary); color: #fff; transition: transform .1s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn.block { display: flex; width: 100%; }
.btn.ghost { background: var(--card); color: var(--primary); border: 1px solid var(--border-strong); }
.btn.soft { background: var(--primary-light); color: var(--primary); }
.btn.danger { background: var(--up); }
.btn.fin { background: var(--fin); }
.btn.sm { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

/* 悬浮新增按钮 */
.fab {
  position: fixed; right: 16px; bottom: calc(var(--h-tabbar) + var(--safe-b) + 16px);
  z-index: 55; width: 54px; height: 54px; border-radius: 50%;
  background: var(--primary); color: #fff; border: 0; font-size: 26px;
  box-shadow: var(--shadow-3); cursor: pointer;
  display: grid; place-items: center; transition: transform .15s;
}
.fab:active { transform: scale(.9); }

/* ---------------- 搜索框 ---------------- */
.searchbar {
  position: sticky; top: calc(var(--h-topbar) + var(--safe-t)); z-index: 50;
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; background: var(--bg);
}
.searchbar input {
  flex: 1; padding: 9px 12px 9px 34px; font-size: 14px;
  border: 1px solid var(--border-strong); border-radius: 20px;
  background: var(--card) url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b97a6'%3E%3Cpath d='M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z'/%3E%3C/svg%3E") no-repeat 10px center;
  background-size: 17px;
  -webkit-appearance: none; appearance: none;
}
.searchbar input:focus { outline: 0; border-color: var(--primary); }

/* ---------------- 空态 / 加载 ---------------- */
.empty { text-align: center; padding: 46px 20px; color: var(--text-3); }
.empty .e-icon { font-size: 44px; opacity: .5; margin-bottom: 10px; }
.empty .e-t { font-size: 14px; margin-bottom: 4px; }
.empty .e-s { font-size: 12px; opacity: .8; }

.spinner {
  width: 26px; height: 26px; margin: 36px auto;
  border: 3px solid var(--border); border-top-color: var(--primary);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------- 底部弹出选择器 ---------------- */
.mask {
  position: fixed; inset: 0; z-index: 90; background: rgba(12, 20, 33, .45);
  opacity: 0; pointer-events: none; transition: opacity .22s;
}
.mask.on { opacity: 1; pointer-events: auto; }

.sheet-pop {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
  max-height: 78vh; display: flex; flex-direction: column;
  background: var(--card); border-radius: 16px 16px 0 0;
  box-shadow: var(--shadow-3);
  transform: translateY(100%); transition: transform .26s cubic-bezier(.3, .8, .3, 1);
}
.sheet-pop.on { transform: none; }
.sheet-pop .sp-hd {
  display: flex; align-items: center; gap: 8px; padding: 13px 14px;
  border-bottom: 1px solid var(--border); font-weight: 600; font-size: 15px;
}
.sheet-pop .sp-hd .sp { flex: 1; }
.sheet-pop .sp-hd .x {
  border: 0; background: transparent; font-size: 20px; color: var(--text-3); cursor: pointer;
  width: 30px; height: 30px; border-radius: 50%;
}
.sheet-pop .sp-hd .x:active { background: var(--bg); }
.sheet-pop .sp-search { padding: 10px 12px 4px; }
.sheet-pop .sp-search input {
  width: 100%; padding: 9px 12px; font-size: 14px; border: 1px solid var(--border-strong);
  border-radius: 20px; background: var(--bg); -webkit-appearance: none; appearance: none;
}
.sheet-pop .sp-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: var(--safe-b); }
.pick {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  border-bottom: 1px solid var(--border); cursor: pointer;
}
.pick:active { background: var(--primary-soft); }
.pick .p-main { flex: 1; min-width: 0; }
.pick .p-t1 { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick .p-t2 { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.pick .p-right { text-align: right; font-size: 12px; color: var(--text-2); flex: none; }
.pick.on { background: var(--primary-light); }
.pick.on .p-t1 { color: var(--primary); font-weight: 600; }

/* ---------------- 提示条 ---------------- */
.alert {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 10px 12px; border-radius: var(--radius-sm); font-size: 12.5px;
  margin-bottom: 12px; line-height: 1.55;
}
.alert.warn { background: var(--warn-bg); color: #7a4a00; }
.alert.danger { background: var(--up-bg); color: #8a1010; }
.alert.info { background: var(--primary-light); color: var(--primary-dark); }
.alert.ok { background: var(--down-bg); color: #14532d; }
.alert .ai { flex: none; font-size: 15px; }

/* ---------------- Toast ---------------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--h-tabbar) + var(--safe-b) + 28px);
  transform: translate(-50%, 16px); z-index: 200;
  max-width: 84vw; padding: 10px 18px; border-radius: 22px;
  background: rgba(22, 32, 46, .93); color: #fff; font-size: 13.5px; font-weight: 500;
  box-shadow: var(--shadow-3); opacity: 0; pointer-events: none;
  transition: opacity .22s, transform .22s; text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------------- 分段控件 ---------------- */
.seg {
  display: flex; gap: 3px; padding: 3px; background: #e6eaf0;
  border-radius: 9px; margin-bottom: 12px;
}
.seg button {
  flex: 1; padding: 8px 6px; font-size: 13px; font-weight: 500; font-family: inherit;
  border: 0; border-radius: 7px; background: transparent; color: var(--text-2);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.seg button.on { background: var(--card); color: var(--primary); font-weight: 600; box-shadow: var(--shadow-1); }

/* ---------------- 图表 ---------------- */
.chart-wrap { width: 100%; overflow: hidden; }
.chart-wrap canvas { display: block; width: 100%; }

/* ---------------- 明细行编辑器 ---------------- */
.lines { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 12px; }
.line-hd {
  display: grid; padding: 7px 10px; background: var(--primary);
  color: #fff; font-size: 11.5px; font-weight: 600; gap: 6px;
}
.line-row {
  display: grid; padding: 8px 10px; border-top: 1px solid var(--border);
  font-size: 13px; gap: 6px; align-items: center;
}
.line-row:nth-child(even) { background: #fafbfd; }
.line-row .lr-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.line-row .lr-num { text-align: right; font-variant-numeric: tabular-nums; }
.line-empty { padding: 20px; text-align: center; color: var(--text-3); font-size: 13px; }

/* ---------------- 键值对行（开单页表头 / 合计区） ---------------- */
.kvrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 0; }
.kvrow + .kvrow { border-top: 1px dashed var(--border); }
.kvk { color: var(--text-2); font-size: 13px; flex: none; }
.kvv { font-weight: 600; text-align: right; word-break: break-all; }

/* ---------------- 登录页 ---------------- */
.login-hero {
  text-align: center;
  padding: 28px 16px 22px;
}
.login-hero .lh-logo {
  font-size: 46px;
  line-height: 1;
  margin-bottom: 12px;
}
.login-hero .lh-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: .5px;
}
.login-hero .lh-sub {
  font-size: 12.5px;
  color: var(--text-3);
  margin-top: 5px;
}

/* ---------------- 用户列表 ---------------- */
.user-list {
  display: flex;
  flex-direction: column;
}
.user-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 11px 2px;
  border-bottom: 1px solid var(--border);
}
.user-row:last-child { border-bottom: 0; }
.ur-avatar {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 700;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ur-main { flex: 1 1 auto; min-width: 0; }
.ur-name {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.ur-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 2px;
}
.ur-act { flex: 0 0 auto; }
.tag-on { background: var(--down-bg); color: var(--down); padding: 1px 6px; border-radius: 5px; font-size: 11px; }
.tag-off { background: #eef1f5; color: var(--text-3); padding: 1px 6px; border-radius: 5px; font-size: 11px; }

/* ---------------- 关于信息行 ---------------- */
.about { display: flex; flex-direction: column; gap: 8px; }
.ab-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  font-size: 13px;
  color: var(--text-2);
}

  const inQty = new Map();

  const outQty = new Map();

  for (const p of purchases) {

    inQty.set(g, (inQty.get(g) || 0) + num(p.qty));
    inAmt.set(g, (inAmt.get(g) || 0) + num(p.net !== undefined ? p.net : p.amount));
  }
  for (const s of sales) {
    const g = s.goodsName;
    if (!g) continue;
    outQty.set(g, (outQty.get(g) || 0) + num(s.qty));
  }

    const outQ = round2(outQty.get(g.name) || 0);
    const cur = round2(initStock + inQ - outQ);

      : (cur < minS ? 'warn'

      : lv === 'warn' ? '⚠ 需补货'

    const iq = inQty.get(g.name) || 0;
    const ia = inAmt.get(g.name) || 0;
    const wavg = iq > 0 ? round2(ia / iq) : num(g.costPrice);

    const costAmt = round2(cur * wavg);
    const retailAmt = round2(cur * num(g.retailPrice));

      brand: g.brand, location: g.location,

    retailAmt += num(r.retailAmt);

    else if (r.status.includes('需补货')) warn++;
    else if (r.status.includes('积压')) over++;
    else ok++;

    units: round2(units), danger, warn, over, ok, count: rows.length,

      const suggest = Math.max(0, round2(num(r.maxStock) - num(r.cur)));

 */
function ledgerRows(chart, vouchers) {
  const dr = new Map(), cr = new Map();
  for (const v of vouchers) {
    const code = v.accountCode;
    if (!code) continue;
    dr.set(code, (dr.get(code) || 0) + num(v.debit));
    cr.set(code, (cr.get(code) || 0) + num(v.credit));
  }
  const rows = chart.map(c => {
    const debit = round2(dr.get(c.code) || 0);
    const credit = round2(cr.get(c.code) || 0);
    const begin = 0;
    const end = round2(begin + debit - credit);
    return {
      code: c.code, name: c.name, category: c.category, direction: c.direction,
      begin, debit, credit, end,
      endText: (end >= 0 ? '借' : '贷') + ' ' + Math.abs(end).toFixed(2),
    };
  });
  let tDr = 0, tCr = 0;
  for (const r of rows) { tDr += r.debit; tCr += r.credit; }
  return {
    rows,
    totalDebit: round2(tDr),
    totalCredit: round2(tCr),
    balanced: Math.abs(round2(tDr - tCr)) < 0.01,
    diff: round2(tDr - tCr),
  };
}

/** 凭证借贷平衡校验：同凭证号下借方合计 = 贷方合计 */
function voucherChecks(vouchers) {
  const map = new Map();
  for (const v of vouchers) {
    const k = v.voucherNo;
    if (!k) continue;
    if (!map.has(k)) map.set(k, { no: k, debit: 0, credit: 0, count: 0, date: v.date, memo: v.memo });
    const o = map.get(k);
    o.debit += num(v.debit);
    o.credit += num(v.credit);
    o.count++;
  }
  const groups = [...map.values()].map(g => {
    const debit = round2(g.debit), credit = round2(g.credit);
    const diff = round2(debit - credit);
    return { ...g, debit, credit, diff, balanced: Math.abs(diff) < 0.01 };
  }).sort((a, b) => String(a.no).localeCompare(String(b.no), 'zh'));

  let tDr = 0, tCr = 0;
  for (const g of groups) { tDr += g.debit; tCr += g.credit; }
  const rows = vouchers.map(v => {
    const g = groups.find(x => x.no === v.voucherNo);
    return {
      ...v,
      accountName: '',
      balance: g ? (g.balanced ? '✔ 平衡' : '✘ 差 ' + g.diff.toFixed(2)) : '',
    };
  });
  return {
    rows, groups,
    totalDebit: round2(tDr), totalCredit: round2(tCr),
    balanced: Math.abs(round2(tDr - tCr)) < 0.01,
    diff: round2(tDr - tCr),
    unbalancedCount: groups.filter(g => !g.balanced).length,

 *  total   = net + taxAmt
 *  owe     = total - paid        （paid 为单据级字段）
 */
function derivePurchase(row, docPaid) {
  const qty = num(row.qty);
  const price = num(row.price);
  const discount = num(row.discount);
  const taxRate = num(row.taxRate);
  const paid = docPaid !== undefined ? num(docPaid) : num(row.paid);

  const amount = round2(qty * price);
  const net = round2(amount * (1 - discount));
  const taxAmt = round2(net * taxRate);
  const total = round2(net + taxAmt);
  const owe = round2(total - paid);

  return { ...row, amount, net, taxAmt, total, owe };
}

/**
 * 销售单行派生
 *  amount     = qty * price
 *  net        = amount * (1 - discount)
 *  costAmount = qty * cost
 *  gross      = net - costAmount
 *  grossRate  = net ? gross/net : ''      空分母返回 ''
 *  owe        = net - paid
 */
function deriveSale(row, docPaid) {
  const qty = num(row.qty);
  const price = num(row.price);
  const discount = num(row.discount);
  const cost = num(row.cost);
  const paid = docPaid !== undefined ? num(docPaid) : num(row.paid);

  const amount = round2(qty * price);
  const net = round2(amount * (1 - discount));
  const costAmount = round2(qty * cost);
  const gross = round2(net - costAmount);
  const grossRate = div(gross, net, 4);
  const owe = round2(net - paid);

  return { ...row, amount, net, costAmount, gross, grossRate, owe };

  if (store === 'sales') return deriveSale(row, docPaid);

  const expense = num(row.expense);

        { k: 'qty', label: '数量', align: 'num', fmt: v => num(v) },
        { k: 'unit', label: '单位', align: 'ctr' },

        ...(isSales

  return () => off && off();

    ctx.fillStyle = cssv('--text-2', '#5a6675');
    ctx.textAlign = 'left';

/** 环形图 */
function donutChart(host, { items, height = 180, centerLabel, centerValue, colors }) {
  const { cv, ctx, w, h } = setupCanvas(host, height);
  const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 6, r = R * .62;
  const total = items.reduce((s, x) => s + Math.abs(num(x.value)), 0) || 1;

  let ang = -Math.PI / 2;
  items.forEach((it, i) => {
    const a = (Math.abs(num(it.value)) / total) * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(cx, cy, R, ang, ang + a);
    ctx.arc(cx, cy, r, ang + a, ang, true);
    ctx.closePath();
    ctx.fillStyle = (colors && colors[i]) || PALETTE[i % PALETTE.length];
    ctx.fill();
    ang += a;
  });

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (centerLabel) {
    ctx.fillStyle = cssv('--text-3', '#8b97a6');
    ctx.font = '11px -apple-system, sans-serif';
    ctx.fillText(centerLabel, cx, cy - 10);
  }
  if (centerValue != null) {
    ctx.fillStyle = cssv('--text', '#1a2029');
    ctx.font = 'bold 17px -apple-system, sans-serif';
    ctx.fillText(String(centerValue), cx, cy + 10);
  }

  host.appendChild(cv);
  return cv;
}

// ---------------- 工具 ----------------
function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function fmtShort(v) {
  const a = Math.abs(v);
  if (a >= 1e8) return (v / 1e8).toFixed(1) + '亿';
  if (a >= 1e4) return (v / 1e4).toFixed(a >= 1e6 ? 0 : 1) + '万';
  if (a >= 1e3) return (v / 1e3).toFixed(1) + 'k';

}

function hexA(hex, a) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  if (!m) return hex;
  return `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${a})`;
}

/** 图例 */
function legend(items, colors) {
  const wrap = el('div', { style: 'display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 2px' });
  items.forEach((it, i) => {

    wrap.appendChild(x);
  });

}

  "barChart": barChart,
  "lineChart": lineChart,
  "hBarChart": hBarChart,
  "donutChart": donutChart,

function editor(container, go, g) {

        <div class="card-bd">

            <span style="color:var(--text-2)">贷方合计</span><b class="down-t">${money(cr)}</b></div>

      box.innerHTML = `

    if (sub) sub.textContent = `${entries.filter(e => e.accountCode).length} 条 · ${money(dr)}`;
  }

  function saveHead() {
    const b = view.querySelector('#v-body');
    if (!b) return;
    head.no = view.querySelector('#v-no').value.trim() || head.no;
    head.date = view.querySelector('#v-date').value;
    head.memo = view.querySelector('#v-memo').value;
    head.source = view.querySelector('#v-src').value;
  }

  function pickAccount(i) {
    picker({
      title: '选择会计科目',
      items: repo.all('chartOfAccounts'),
      keyOf: a => a.code,
      searchText: a => [a.code, a.name, a.category, a.memo].join(' '),
      render: a => ({ t1: `${esc(a.code)} ${esc(a.name)}`, t2: `${esc(a.category || '')} · 余额${esc(a.direction || '')}方` }),
      onPick: a => {

        entries[i].accountName = a.name;

  function doCancel() { go('/fin/vouchers'); }

  async function doSave() {
    saveHead();
    if (!head.no) { toast('请填写凭证号'); return; }
    const valid = entries.filter(e => e.accountCode && (num(e.debit) || num(e.credit)));
    if (valid.length < 2) { toast('至少需要两条有科目的分录'); return; }
    const dr = round2(valid.reduce((s, e) => s + num(e.debit), 0));
    const cr = round2(valid.reduce((s, e) => s + num(e.credit), 0));
    if (Math.abs(dr - cr) > 0.005) {
      toast(`借贷不平衡，差额 ${money(dr - cr)}`);
      return;
    }

    // 删除旧分录
    if (g) for (const e of g.entries) await repo.del('vouchers', e.id);

        id: `${head.no}#${n}`,
        voucherNo: head.no, date: head.date, memo: head.memo,
        accountCode: e.accountCode, accountName: e.accountName,
        debit: num(e.debit), credit: num(e.credit),
        source: head.source,
      });
    }
    toast('凭证已保存');
    go('/fin/vouchers');
  }

  return { cleanup: () => { } };
}
